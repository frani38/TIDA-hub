<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="460" viewBox="0 0 1100 460" role="img" aria-labelledby="title desc">
  <title id="title">Topologías de red</title>
  <desc id="desc">Comparación de topologías centralizada, descentralizada y distribuida. La blockchain opera como red distribuida.</desc>
  <rect width="1100" height="460" fill="#f8fafc"/>
  <defs>
    <style type="text/css"><![CDATA[
      .t { font-family: "Segoe UI", system-ui, sans-serif; fill: #0f172a; }
      .title { font-size: 22px; font-weight: 800; }
      .sub { font-size: 13.5px; font-weight: 500; fill: #475569; }
      .h { font-size: 17px; font-weight: 800; }
      .tag { font-size: 12px; font-weight: 700; fill: #047857; }
      .cap { font-size: 13px; font-weight: 600; fill: #334155; }
      .hub-label { font-size: 10px; font-weight: 700; fill: #fff; }
    ]]></style>
  </defs>

  <text class="t title" x="550" y="34" text-anchor="middle">Topologías de red</text>
  <text class="t sub" x="550" y="56" text-anchor="middle">La blockchain opera como red distribuida de nodos con historial compartido</text>

  <!-- ========== CENTRALIZADA ========== -->
  <rect x="30" y="78" width="330" height="350" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text class="t h" x="195" y="108" text-anchor="middle">Centralizada</text>

  <g stroke="#64748b" stroke-width="2" fill="none">
    <line x1="195" y1="230" x2="125" y2="165"/>
    <line x1="195" y1="230" x2="195" y2="155"/>
    <line x1="195" y1="230" x2="265" y2="165"/>
    <line x1="195" y1="230" x2="120" y2="295"/>
    <line x1="195" y1="230" x2="270" y2="295"/>
    <line x1="195" y1="230" x2="195" y2="325"/>
  </g>
  <circle cx="125" cy="165" r="12" fill="#94a3b8"/>
  <circle cx="195" cy="155" r="12" fill="#94a3b8"/>
  <circle cx="265" cy="165" r="12" fill="#94a3b8"/>
  <circle cx="120" cy="295" r="12" fill="#94a3b8"/>
  <circle cx="270" cy="295" r="12" fill="#94a3b8"/>
  <circle cx="195" cy="325" r="12" fill="#94a3b8"/>
  <circle cx="195" cy="230" r="24" fill="#2563eb"/>
  <text class="hub-label" x="195" y="234" text-anchor="middle">HUB</text>

  <text class="t cap" x="195" y="375" text-anchor="middle">Un hub controla todas</text>
  <text class="t cap" x="195" y="394" text-anchor="middle">las conexiones</text>

  <!-- ========== DESCENTRALIZADA ========== -->
  <rect x="385" y="78" width="330" height="350" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text class="t h" x="550" y="108" text-anchor="middle">Descentralizada</text>

  <!-- hubs triangle -->
  <g stroke="#64748b" stroke-width="2" fill="none">
    <line x1="480" y1="205" x2="620" y2="205"/>
    <line x1="480" y1="205" x2="550" y2="310"/>
    <line x1="620" y1="205" x2="550" y2="310"/>
  </g>
  <!-- leaf links -->
  <g stroke="#a78bfa" stroke-width="1.75" fill="none">
    <line x1="480" y1="205" x2="440" y2="165"/>
    <line x1="480" y1="205" x2="445" y2="245"/>
    <line x1="480" y1="205" x2="520" y2="165"/>
    <line x1="620" y1="205" x2="580" y2="165"/>
    <line x1="620" y1="205" x2="660" y2="165"/>
    <line x1="620" y1="205" x2="655" y2="245"/>
    <line x1="550" y1="310" x2="505" y2="350"/>
    <line x1="550" y1="310" x2="595" y2="350"/>
    <line x1="550" y1="310" x2="550" y2="265"/>
  </g>
  <circle cx="440" cy="165" r="9" fill="#94a3b8"/>
  <circle cx="445" cy="245" r="9" fill="#94a3b8"/>
  <circle cx="520" cy="165" r="9" fill="#94a3b8"/>
  <circle cx="580" cy="165" r="9" fill="#94a3b8"/>
  <circle cx="660" cy="165" r="9" fill="#94a3b8"/>
  <circle cx="655" cy="245" r="9" fill="#94a3b8"/>
  <circle cx="505" cy="350" r="9" fill="#94a3b8"/>
  <circle cx="595" cy="350" r="9" fill="#94a3b8"/>
  <circle cx="550" cy="265" r="9" fill="#94a3b8"/>
  <circle cx="480" cy="205" r="18" fill="#7c3aed"/>
  <circle cx="620" cy="205" r="18" fill="#7c3aed"/>
  <circle cx="550" cy="310" r="18" fill="#7c3aed"/>

  <text class="t cap" x="550" y="394" text-anchor="middle">Varios centros locales</text>

  <!-- ========== DISTRIBUIDA ========== -->
  <rect x="740" y="78" width="330" height="350" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text class="t h" x="905" y="108" text-anchor="middle">Distribuida</text>
  <text class="t tag" x="905" y="128" text-anchor="middle">(típica de la blockchain)</text>

  <!-- Regular hexagon mesh of 7 nodes (6 ring + 1 center) -->
  <!-- positions around center 905,250 with radius ~78 -->
  <!-- angles: -90, -30, 30, 90, 150, 210 degrees -->
  <g stroke="#047857" stroke-width="1.85" fill="none">
    <!-- outer ring -->
    <line x1="905" y1="172" x2="972" y2="211"/>
    <line x1="972" y1="211" x2="972" y2="289"/>
    <line x1="972" y1="289" x2="905" y2="328"/>
    <line x1="905" y1="328" x2="838" y2="289"/>
    <line x1="838" y1="289" x2="838" y2="211"/>
    <line x1="838" y1="211" x2="905" y2="172"/>
    <!-- spokes to center -->
    <line x1="905" y1="172" x2="905" y2="250"/>
    <line x1="972" y1="211" x2="905" y2="250"/>
    <line x1="972" y1="289" x2="905" y2="250"/>
    <line x1="905" y1="328" x2="905" y2="250"/>
    <line x1="838" y1="289" x2="905" y2="250"/>
    <line x1="838" y1="211" x2="905" y2="250"/>
  </g>
  <circle cx="905" cy="172" r="13" fill="#059669"/>
  <circle cx="972" cy="211" r="13" fill="#059669"/>
  <circle cx="972" cy="289" r="13" fill="#059669"/>
  <circle cx="905" cy="328" r="13" fill="#059669"/>
  <circle cx="838" cy="289" r="13" fill="#059669"/>
  <circle cx="838" cy="211" r="13" fill="#059669"/>
  <circle cx="905" cy="250" r="13" fill="#059669"/>

  <text class="t cap" x="905" y="375" text-anchor="middle">Malla de pares:</text>
  <text class="t cap" x="905" y="394" text-anchor="middle">sin un único punto de fallo</text>
</svg>
