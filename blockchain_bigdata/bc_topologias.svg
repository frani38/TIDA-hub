<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Topologías de red</title>
  <desc id="desc">Comparación de topologías centralizada, descentralizada y distribuida. La blockchain opera como red distribuida.</desc>
  <rect width="1200" height="520" fill="#f8fafc"/>
  <defs>
    <style type="text/css"><![CDATA[
      .t { font-family: "Segoe UI", system-ui, sans-serif; fill: #0f172a; }
      .title { font-size: 28px; font-weight: 800; }
      .sub { font-size: 16px; font-weight: 500; fill: #475569; }
      .h { font-size: 22px; font-weight: 800; }
      .tag { font-size: 14px; font-weight: 700; fill: #047857; }
      .cap { font-size: 15px; font-weight: 600; fill: #334155; }
      .hub-label { font-size: 13px; font-weight: 700; fill: #fff; }
    ]]></style>
  </defs>

  <text class="t title" x="600" y="42" text-anchor="middle">Topologías de red</text>
  <text class="t sub" x="600" y="70" text-anchor="middle">La blockchain opera como red distribuida de nodos con historial compartido</text>

  <!-- ========== CENTRALIZADA ========== -->
  <rect x="36" y="96" width="360" height="390" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text class="t h" x="216" y="138" text-anchor="middle">Centralizada</text>

  <!-- hub -->
  <line x1="216" y1="265" x2="116" y2="175" stroke="#64748b" stroke-width="3.5"/>
  <line x1="216" y1="265" x2="216" y2="168" stroke="#64748b" stroke-width="3.5"/>
  <line x1="216" y1="265" x2="316" y2="175" stroke="#64748b" stroke-width="3.5"/>
  <line x1="216" y1="265" x2="108" y2="330" stroke="#64748b" stroke-width="3.5"/>
  <line x1="216" y1="265" x2="324" y2="330" stroke="#64748b" stroke-width="3.5"/>
  <line x1="216" y1="265" x2="216" y2="372" stroke="#64748b" stroke-width="3.5"/>

  <circle cx="116" cy="175" r="22" fill="#94a3b8"/>
  <circle cx="216" cy="168" r="22" fill="#94a3b8"/>
  <circle cx="316" cy="175" r="22" fill="#94a3b8"/>
  <circle cx="108" cy="330" r="22" fill="#94a3b8"/>
  <circle cx="324" cy="330" r="22" fill="#94a3b8"/>
  <circle cx="216" cy="372" r="22" fill="#94a3b8"/>
  <circle cx="216" cy="265" r="38" fill="#2563eb"/>
  <text class="hub-label" x="216" y="270" text-anchor="middle">HUB</text>

  <text class="t cap" x="216" y="430" text-anchor="middle">Un hub controla todas</text>
  <text class="t cap" x="216" y="452" text-anchor="middle">las conexiones</text>

  <!-- ========== DESCENTRALIZADA ========== -->
  <rect x="420" y="96" width="360" height="390" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text class="t h" x="600" y="138" text-anchor="middle">Descentralizada</text>

  <!-- links between hubs -->
  <line x1="510" y1="230" x2="690" y2="230" stroke="#64748b" stroke-width="3.5"/>
  <line x1="510" y1="230" x2="600" y2="350" stroke="#64748b" stroke-width="3.5"/>
  <line x1="690" y1="230" x2="600" y2="350" stroke="#64748b" stroke-width="3.5"/>

  <!-- left cluster -->
  <line x1="510" y1="230" x2="455" y2="175" stroke="#a78bfa" stroke-width="2.5"/>
  <line x1="510" y1="230" x2="465" y2="275" stroke="#a78bfa" stroke-width="2.5"/>
  <line x1="510" y1="230" x2="555" y2="175" stroke="#a78bfa" stroke-width="2.5"/>
  <circle cx="455" cy="175" r="16" fill="#94a3b8"/>
  <circle cx="465" cy="275" r="16" fill="#94a3b8"/>
  <circle cx="555" cy="175" r="16" fill="#94a3b8"/>
  <circle cx="510" cy="230" r="30" fill="#7c3aed"/>

  <!-- right cluster -->
  <line x1="690" y1="230" x2="645" y2="175" stroke="#a78bfa" stroke-width="2.5"/>
  <line x1="690" y1="230" x2="745" y2="175" stroke="#a78bfa" stroke-width="2.5"/>
  <line x1="690" y1="230" x2="735" y2="275" stroke="#a78bfa" stroke-width="2.5"/>
  <circle cx="645" cy="175" r="16" fill="#94a3b8"/>
  <circle cx="745" cy="175" r="16" fill="#94a3b8"/>
  <circle cx="735" cy="275" r="16" fill="#94a3b8"/>
  <circle cx="690" cy="230" r="30" fill="#7c3aed"/>

  <!-- bottom cluster -->
  <line x1="600" y1="350" x2="545" y2="395" stroke="#a78bfa" stroke-width="2.5"/>
  <line x1="600" y1="350" x2="655" y2="395" stroke="#a78bfa" stroke-width="2.5"/>
  <line x1="600" y1="350" x2="600" y2="300" stroke="#a78bfa" stroke-width="2.5"/>
  <circle cx="545" cy="395" r="16" fill="#94a3b8"/>
  <circle cx="655" cy="395" r="16" fill="#94a3b8"/>
  <circle cx="600" cy="300" r="16" fill="#94a3b8"/>
  <circle cx="600" cy="350" r="30" fill="#7c3aed"/>

  <text class="t cap" x="600" y="448" text-anchor="middle">Varios centros locales</text>

  <!-- ========== DISTRIBUIDA ========== -->
  <rect x="804" y="96" width="360" height="390" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="2.5"/>
  <text class="t h" x="984" y="138" text-anchor="middle">Distribuida</text>
  <text class="t tag" x="984" y="162" text-anchor="middle">(típica de la blockchain)</text>

  <!-- mesh nodes: hexagon-like ring + diagonals -->
  <g stroke="#047857" stroke-width="3" fill="none">
    <line x1="904" y1="230" x2="984" y2="200"/>
    <line x1="984" y1="200" x2="1064" y2="230"/>
    <line x1="1064" y1="230" x2="1084" y2="310"/>
    <line x1="1084" y1="310" x2="1024" y2="370"/>
    <line x1="1024" y1="370" x2="944" y2="370"/>
    <line x1="944" y1="370" x2="884" y2="310"/>
    <line x1="884" y1="310" x2="904" y2="230"/>
    <!-- cross links -->
    <line x1="904" y1="230" x2="944" y2="370"/>
    <line x1="1064" y1="230" x2="1024" y2="370"/>
    <line x1="904" y1="230" x2="1064" y2="230" stroke-dasharray="7 5"/>
    <line x1="884" y1="310" x2="1084" y2="310" stroke-dasharray="7 5"/>
    <line x1="984" y1="200" x2="984" y2="340"/>
  </g>
  <circle cx="904" cy="230" r="24" fill="#059669"/>
  <circle cx="984" cy="200" r="24" fill="#059669"/>
  <circle cx="1064" cy="230" r="24" fill="#059669"/>
  <circle cx="1084" cy="310" r="24" fill="#059669"/>
  <circle cx="1024" cy="370" r="24" fill="#059669"/>
  <circle cx="944" cy="370" r="24" fill="#059669"/>
  <circle cx="884" cy="310" r="24" fill="#059669"/>
  <circle cx="984" cy="340" r="24" fill="#059669"/>

  <text class="t cap" x="984" y="430" text-anchor="middle">Malla de pares:</text>
  <text class="t cap" x="984" y="452" text-anchor="middle">sin un único punto de fallo</text>
</svg>
