    <script>
      (function () {
        function loadApp(bust) {
          var app = document.createElement("script");
          app.src = "./app.js?v=" + encodeURIComponent(bust);
          document.body.appendChild(app);
        }
        function loadDataFreshThenApp(bust) {
          // Contenido editorial: siempre sin caché (noticias/libros sin bump de versión).
          fetch("./data.js?_=" + Date.now(), { cache: "no-store", credentials: "same-origin" })
            .then(function (r) {
              if (!r.ok) throw new Error("data.js " + r.status);
              return r.text();
            })
            .then(function (txt) {
              if (typeof window.MYWEB_injectDataJs === "function") {
                window.MYWEB_injectDataJs(txt);
              } else {
                var s = document.createElement("script");
                s.text = txt;
                document.body.appendChild(s);
              }
              loadApp(bust);
            })
            .catch(function () {
              console.error("No se pudo cargar data.js");
            });
        }
        function bootAssets(bust, dataJsText) {
          bust = String(bust || window.MYWEB_ASSET_V || "1.3.0");
          window.MYWEB_ASSET_V = bust;
          if (typeof window.MYWEB_wireVersionedLinks === "function") {
            window.MYWEB_wireVersionedLinks(bust);
          }
          if (dataJsText && typeof window.MYWEB_injectDataJs === "function") {
            window.MYWEB_injectDataJs(dataJsText);
            loadApp(bust);
            return;
          }
          if (dataJsText) {
            var s = document.createElement("script");
            s.text = dataJsText;
            document.body.appendChild(s);
            loadApp(bust);
            return;
          }
          loadDataFreshThenApp(bust);
        }
        var started = false;
        function start(bust, dataJsText) {
          if (started) return;
          started = true;
          bootAssets(bust, dataJsText);
        }
        window.addEventListener("myweb:version-ready", function (ev) {
          var d = (ev && ev.detail) || {};
          start(d.version || window.MYWEB_ASSET_V, d.dataJsText || "");
        });
        // Si version-boot falla o tarda, no bloquear la web.
        setTimeout(function () {
          start(window.MYWEB_ASSET_V || "1.3.0", window.__MYWEB_DATA_JS_TEXT__ || "");
        }, 2500);
      })();
    </script>
